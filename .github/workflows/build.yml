name: Build Subscription

on:
push:
paths:
- 'configsVlessRealty.txt'
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - run: python build.py

  - name: Commit subscription
    run: |
      git config user.name github-actions
      git config user.email github-actions@github.com
      git add JerkStyle.txt
      git diff --cached --quiet || git commit -m "Update JerkStyle"
      git push
