name: Build Subscription

on:
  push:
    paths:
      - 'vpn_configs.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: python build.py

      - name: Commit subscription
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add vpnall.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update vpnall"
            git push
          fi
